# Eos Agent 配置
# 模型由全局 LLM 配置管理（Settings 应用 → ~/.aetheros/llm/config.json）
# Agent 只需指定模型引用（provider_id/model_id）和行为参数

model: ""           # 模型引用，如 openai-main/gpt-4o（留空则在界面中选择）
max_iterations: 50  # 工具调用循环上限

# 系统提示词配置（模块化架构）
system_prompt: |
  你是 Eos Agent，一个强大的 AI 编程助手。
  你可以读写文件、执行终端命令、分析代码。
  请用中文回复。

# 语言偏好（影响系统提示词中的语言指令）
language: "中文"

# 高级选项（可选）
# override_system_prompt: ""   # 完全覆盖系统提示词（优先级最高）
# append_system_prompt: ""     # 始终追加在末尾的提示词

# 上下文管理
context:
  strategy: none  # none | sliding_window | summary | layered
  max_tokens: 1000000
  compress_threshold: 1.0

# Eos-Context 文件上下文管理
eos_context_enabled: true  # 启用 Eos-Context 文件上下文管理器

# 工具集配置（可选）
# toolset: null  # 加载所有工具（默认）
# toolset: "eos-tools-file-management"  # 只加载 Eos-Tools 文件管理工具集
toolset: "default"  # 加载默认工具集（文件 + 终端 + Eos-Tools）
