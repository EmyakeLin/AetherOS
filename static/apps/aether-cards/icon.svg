<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" />
        </filter>
    </defs>

    <!--
      LAYER 1: BACK CARD (CYAN)
      The rearmost card in the stack, slightly offset up-left.
    -->
    <rect x="10" y="12" width="32" height="22" rx="3"
          fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"
          stroke-linejoin="round" stroke-linecap="round" />

    <!--
      LAYER 2: MIDDLE CARD (CYAN)
      The second card, offset diagonally.
    -->
    <rect x="16" y="18" width="32" height="22" rx="3"
          fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.65"
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- Text lines on middle card -->
    <line x1="20" y1="24" x2="32" y2="24" stroke="#00e5ff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="20" y1="28" x2="28" y2="28" stroke="#00e5ff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

    <!--
      LAYER 3: INNER GLOW (INDIGO)
      An inset blur on the front card to create the indigo inner neon glow.
    -->
    <rect x="21" y="25" width="32" height="22" rx="3"
          fill="none" stroke="#6c5ce7" stroke-width="2" filter="url(#glowBlur)" opacity="0.8"
          stroke-linejoin="round" />

    <!--
      LAYER 4: FRONT CARD (MAIN)
      The foremost card with indigo tint and cyan stroke.
    -->
    <rect x="19" y="23" width="34" height="24" rx="3"
          fill="#6c5ce7" fill-opacity="0.08"
          stroke="#00e5ff" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- Text lines on front card (content representation) -->
    <line x1="24" y1="30" x2="40" y2="30" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="24" y1="34" x2="36" y2="34" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="24" y1="38" x2="30" y2="38" stroke="#6c5ce7" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!--
      LAYER 5: CYBERPUNK ACCENTS
    -->
    <!-- Floating downward triangle (▽) accent above the stack -->
    <polygon points="30.5,8 33.5,8 32,11" fill="#6c5ce7" opacity="0.9" stroke="#6c5ce7" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Data tracks (bottom left) -->
    <line x1="10" y1="50" x2="17" y2="50" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="10" y1="54" x2="13" y2="54" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="54" x2="18" y2="54" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Angled circuit track & terminal node (bottom right) -->
    <path d="M 40 50 L 43 50 L 45 48 L 52 48" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="52" cy="48" r="1.5" fill="#6c5ce7" opacity="0.9"/>

    <!-- Small indigo connection dot on front card corner -->
    <circle cx="53" cy="23" r="1.2" fill="#6c5ce7" opacity="0.8"/>
</svg>
