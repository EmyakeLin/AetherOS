<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #06080f;
    font-family: 'Iosevka Charon', 'LXGW WenKai', sans-serif;
    color: #eef0f8;
}
.logo {
    font-size: 48px; color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.3);
    margin-bottom: 8px; font-weight: 300;
}
.title {
    font-size: 13px; letter-spacing: 6px; color: #5a6280;
    text-transform: uppercase; margin-bottom: 40px;
}
.search-wrap {
    width: min(560px, 85vw); position: relative;
}
.search-input {
    width: 100%;
    padding: 12px 48px 12px 18px;
    background: rgba(160,220,255,0.06);
    border: 1px solid rgba(160,220,255,0.15);
    border-radius: 12px;
    color: #eef0f8;
    font-family: inherit; font-size: 14px; outline: none;
    backdrop-filter: blur(12px);
    transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
    border-color: rgba(0,229,255,0.3);
    box-shadow: 0 0 0 2px rgba(0,229,255,0.08);
}
.search-input::placeholder { color: #4a5270; }
.search-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2);
    color: #00e5ff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
}
.search-btn:hover { background: rgba(0,229,255,0.2); }
.shortcuts {
    display: flex; gap: 16px; margin-top: 36px; flex-wrap: wrap; justify-content: center;
}
.shortcut {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 16px; border-radius: 10px; cursor: pointer;
    background: rgba(160,220,255,0.04); border: 1px solid rgba(160,220,255,0.08);
    transition: all 0.15s; color: inherit; min-width: 72px;
    user-select: none;
}
.shortcut:hover { background: rgba(160,220,255,0.10); border-color: rgba(160,220,255,0.18); }
.shortcut:active { transform: scale(0.96); }
.shortcut-icon { font-size: 20px; }
.shortcut-label { font-size: 10px; color: #5a6280; }
.footer {
    position: fixed; bottom: 16px; font-size: 10px; color: #2a3050; letter-spacing: 1px;
}
</style>
</head>
<body>
    <div class="logo">▽</div>
    <div class="title">N.O.V.A Aether</div>
    <div class="search-wrap">
        <input class="search-input" id="q" placeholder="搜索或输入网址..." autofocus>
        <button class="search-btn" id="go">▸</button>
    </div>
    <div class="shortcuts" id="shortcuts">
        <div class="shortcut" data-url="https://www.bing.com">
            <div class="shortcut-icon">🔍</div><div class="shortcut-label">Bing</div>
        </div>
        <div class="shortcut" data-url="https://github.com">
            <div class="shortcut-icon">🐙</div><div class="shortcut-label">GitHub</div>
        </div>
        <div class="shortcut" data-url="https://stackoverflow.com">
            <div class="shortcut-icon">📚</div><div class="shortcut-label">StackOverflow</div>
        </div>
        <div class="shortcut" data-url="https://developer.mozilla.org">
            <div class="shortcut-icon">📖</div><div class="shortcut-label">MDN</div>
        </div>
        <div class="shortcut" data-url="https://chat.openai.com">
            <div class="shortcut-icon">🤖</div><div class="shortcut-label">ChatGPT</div>
        </div>
    </div>
    <div class="footer">N.O.V.A AETHER OS — BROWSER</div>
    <script>
        var input = document.getElementById('q');
        var goBtn = document.getElementById('go');
        var shortcuts = document.getElementById('shortcuts');

        function doSearch() {
            var v = input.value.trim();
            if (!v) return;
            var url;
            if (/^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+/.test(v)) {
                url = /^https?:\/\//i.test(v) ? v : 'https://' + v;
            } else {
                url = 'https://www.bing.com/search?q=' + encodeURIComponent(v);
            }
            // Tell parent to navigate
            window.parent.postMessage({ type: 'navigate', url: url }, '*');
        }

        goBtn.addEventListener('click', doSearch);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
        });

        // Shortcut clicks — use div, no <a>, no default behavior
        shortcuts.addEventListener('click', function(e) {
            var el = e.target.closest('.shortcut');
            if (!el) return;
            var url = el.getAttribute('data-url');
            if (url) {
                window.parent.postMessage({ type: 'navigate', url: url }, '*');
            }
        });
    </script>
</body>
</html>
