<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Filter to create the faint inner neon glow effect -->
        <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" />
        </filter>
    </defs>

    <!-- 
      LAYER 1: BACK FRAME ACCENTS
      Horizontal alignment tracks behind the main frame to establish depth.
    -->
    <line x1="22" y1="12" x2="42" y2="12" stroke="#00e5ff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="22" y1="52" x2="42" y2="52" stroke="#00e5ff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

    <!-- 
      LAYER 2: INNER GLOW (INDIGO)
      An inset hexagonal path that creates the faint indigo inner aura.
    -->
    <path d="M 32 10 
             L 50 20.5 
             L 50 43.5 
             L 32 54 
             L 14 43.5 
             L 14 20.5 Z" 
          fill="none" stroke="#6c5ce7" stroke-width="2" filter="url(#glowBlur)" opacity="0.8" stroke-linejoin="round"/>

    <!-- 
      LAYER 3: FRONT HEXAGONAL FRAME
      The main chassis of the icon, filled with a faint indigo tint.
    -->
    <path d="M 32 8 
             L 52 19.5 
             L 52 44.5 
             L 32 56 
             L 12 44.5 
             L 12 19.5 Z" 
          fill="#6c5ce7" fill-opacity="0.08" 
          stroke="#00e5ff" stroke-width="1.5" 
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- 
      LAYER 4: IDE CORE (</>_)
      The angled code brackets and the animated terminal cursor.
    -->
    <!-- Left Bracket < -->
    <path d="M 22 26 L 16 32 L 22 38" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Slash / (Indigo Accent) -->
    <line x1="27" y1="39" x2="33" y2="25" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 38 26 L 44 32 L 38 38" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Blinking Cursor Bar _ -->
    <line x1="42" y1="38" x2="48" y2="38" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </line>

    <!-- 
      LAYER 5: CYBERPUNK DETAILS 
      Viewfinder guides, data ports mimicking line numbers, and circuit traces.
    -->
    <!-- Inner Viewfinder Arches (Top & Bottom) -->
    <path d="M 28 13 L 32 10.5 L 36 13" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28 51 L 32 53.5 L 36 51" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Edge Data Ports (Conceptual IDE Line Numbers) -->
    <circle cx="12" cy="26" r="1.25" fill="#6c5ce7" />
    <circle cx="12" cy="32" r="1.25" fill="#00e5ff" />
    <circle cx="12" cy="38" r="1.25" fill="#6c5ce7" />

    <!-- Right Side Angled Circuit Extraction -->
    <path d="M 52 32 L 56 32 L 58 30" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="58" cy="30" r="1.25" fill="#6c5ce7" />

    <!-- Floating Geometry Accent (Top Center) -->
    <polygon points="32,18 30.5,15.5 33.5,15.5" fill="#6c5ce7" opacity="0.9" stroke="#6c5ce7" stroke-width="0.5" stroke-linejoin="round"/>
</svg>
