<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5"/>
        </filter>
    </defs>

    <!-- Inner glow ring -->
    <circle cx="32" cy="32" r="20" fill="none" stroke="#6c5ce7" stroke-width="2"
            filter="url(#glowBlur)" opacity="0.8"/>

    <!-- Outer ring -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#00e5ff" stroke-width="1.5"/>

    <!-- Faint indigo fill -->
    <circle cx="32" cy="32" r="22" fill="#6c5ce7" fill-opacity="0.06"/>

    <!-- Globe longitude lines -->
    <ellipse cx="32" cy="32" rx="10" ry="22" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
    <ellipse cx="32" cy="32" rx="16" ry="22" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>

    <!-- Globe latitude lines -->
    <ellipse cx="32" cy="24" rx="20" ry="4" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
    <ellipse cx="32" cy="40" rx="20" ry="4" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>

    <!-- Central connection node -->
    <circle cx="32" cy="32" r="2" fill="#00e5ff" opacity="0.8"/>

    <!-- Accent triangle top -->
    <polygon points="30.5,8 33.5,8 32,11" fill="#6c5ce7" opacity="0.9" stroke="#6c5ce7" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Bottom data tracks -->
    <line x1="14" y1="50" x2="21" y2="50" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="14" y1="54" x2="17" y2="54" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="54" x2="22" y2="54" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right circuit -->
    <path d="M 44 52 L 47 52 L 49 50 L 54 50" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="54" cy="50" r="1.5" fill="#6c5ce7" opacity="0.9"/>
</svg>