<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Filter to create the faint inner neon glow effect -->
        <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" />
        </filter>
    </defs>

    <!-- 
      LAYER 1: BACK TAB
      The rear layer of the folder, showing the file tab and its structure.
    -->
    <path d="M 12 24 
             L 12 16 
             L 14 14 
             L 26 14 
             L 30 19 
             L 48 19 
             L 50 21 
             L 50 24" 
          fill="none" stroke="#00e5ff" stroke-width="1.5" 
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- Tech accent on the back tab -->
    <line x1="16" y1="17" x2="22" y2="17" stroke="#00e5ff" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

    <!-- Gap bridge line to create depth behind the front flap cutout -->
    <line x1="26" y1="24" x2="38" y2="24" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

    <!-- 
      LAYER 2: INNER GLOW (INDIGO)
      An inset, slightly blurred stroke that creates the faint indigo inner glow.
    -->
    <path d="M 14 26 
             L 24.5 26 
             L 32 34 
             L 39.5 26 
             L 50 26 
             L 52 28 
             L 52 46 
             L 50 48 
             L 14 48 
             L 12 46 
             L 12 28 Z" 
          fill="none" stroke="#6c5ce7" stroke-width="2" filter="url(#glowBlur)" opacity="0.8" stroke-linejoin="round"/>

    <!-- 
      LAYER 3: FRONT FLAP
      The main body of the folder featuring the downward triangle cutout and chamfered corners.
      Filled with a very faint indigo tint to boost the inner glow effect.
    -->
    <path d="M 12 24 
             L 26 24 
             L 32 31 
             L 38 24 
             L 52 24 
             L 54 26 
             L 54 48 
             L 52 50 
             L 12 50 
             L 10 48 
             L 10 26 Z" 
          fill="#6c5ce7" fill-opacity="0.08" 
          stroke="#00e5ff" stroke-width="1.5" 
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- 
      LAYER 4: CYBERPUNK ACCENTS 
    -->
    <!-- Floating downward triangle (▽) accent dropping into the cutout -->
    <polygon points="30.5,20.5 33.5,20.5 32,23.5" fill="#6c5ce7" opacity="0.9" stroke="#6c5ce7" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Left side data tracks -->
    <line x1="16" y1="34" x2="23" y2="34" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="38" x2="19" y2="38" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="22" y1="38" x2="24" y2="38" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right side angled circuit track & terminal node -->
    <path d="M 38 44 L 41 44 L 43 42 L 48 42" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="48" cy="42" r="1.5" fill="#6c5ce7" opacity="0.9"/>
</svg>
