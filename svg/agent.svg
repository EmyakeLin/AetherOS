<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Filter to create the faint inner neon glow effect -->
        <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" />
        </filter>
    </defs>

    <!-- 
      LAYER 1: OUTER NEURAL CASING (CYAN)
      A main, central brain/node casing shape.
    -->
    <circle cx="32" cy="32" r="22" 
            fill="none" stroke="#00e5ff" stroke-width="1.5" 
            stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 
      LAYER 2: INNER GLOW (INDIGO)
      An inset, slightly blurred stroke that creates the faint indigo inner glow.
    -->
    <circle cx="32" cy="32" r="20"
            fill="none" stroke="#6c5ce7" stroke-width="2" 
            filter="url(#glowBlur)" opacity="0.8" 
            stroke-linejoin="round"/>

    <!-- 
      LAYER 3: INNER TINT & NEURAL NETWORK (INDIGO)
      Faint tint fill, plus the internal nodes and connecting lines.
    -->
    <!-- Faint indigo tint -->
    <circle cx="32" cy="32" r="22"
            fill="#6c5ce7" fill-opacity="0.08" stroke="none"/>

    <!-- Internal Neural Nodes (Small Indigo Circles) -->
    <circle cx="32" cy="32" r="1.5" fill="#6c5ce7" />
    <circle cx="26" cy="32" r="1.5" fill="#6c5ce7" />
    <circle cx="38" cy="32" r="1.5" fill="#6c5ce7" />
    <circle cx="32" cy="26" r="1.5" fill="#6c5ce7" />
    <circle cx="32" cy="38" r="1.5" fill="#6c5ce7" />
    <circle cx="29" cy="29" r="1.5" fill="#6c5ce7" />
    <circle cx="35" cy="35" r="1.5" fill="#6c5ce7" />

    <!-- Internal Network Connections (Indigo Lines) -->
    <line x1="32" y1="26" x2="32" y2="38" stroke="#6c5ce7" stroke-width="1" />
    <line x1="26" y1="32" x2="38" y2="32" stroke="#6c5ce7" stroke-width="1" />
    <line x1="29" y1="29" x2="35" y2="35" stroke="#6c5ce7" stroke-width="1" />
    <line x1="26" y1="32" x2="29" y2="29" stroke="#6c5ce7" stroke-width="1" />
    <line x1="29" y1="29" x2="32" y2="26" stroke="#6c5ce7" stroke-width="1" />
    <line x1="32" y1="26" x2="35" y2="35" stroke="#6c5ce7" stroke-width="1" />
    <line x1="35" y1="35" x2="38" y2="32" stroke="#6c5ce7" stroke-width="1" />
    <line x1="38" y1="32" x2="32" y2="38" stroke="#6c5ce7" stroke-width="1" />
    <line x1="32" y1="38" x2="26" y2="32" stroke="#6c5ce7" stroke-width="1" />

    <!-- 
      LAYER 4: CYBERPUNK ACCENTS 
    -->
    <!-- Floating downward triangle (▽) accent dropping into the top -->
    <polygon points="30.5,10.5 33.5,10.5 32,13.5" fill="#6c5ce7" opacity="0.9" stroke="#6c5ce7" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Data tracks near the bottom (Cyan, varying opacity) -->
    <line x1="16" y1="46" x2="23" y2="46" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="50" x2="19" y2="50" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="22" y1="50" x2="24" y2="50" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Angled circuit track & terminal node (Cyan & Indigo) -->
    <path d="M 44 48 L 47 48 L 49 46 L 54 46" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="54" cy="46" r="1.5" fill="#6c5ce7" opacity="0.9"/>
</svg>

