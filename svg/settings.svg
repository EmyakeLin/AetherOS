<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <!-- Filter to create a faint inner neon purple glow effect, imitating the sample -->
        <filter id="purpleGlowBlur" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur stdDeviation="1.2" />
        </filter>
    </defs>

    <!-- 
      LAYER 1: MAIN CONTAINER (OUTER STROKE)
      The primary shape of the settings window, a hexagonal gear, retained in bright blue.
    -->
    <path d="M 53 19.9
             L 53 27 L 49 29 L 49 35 L 53 37 L 53 44.1
             L 46.8 47.7 L 43.1 45.2 L 37.9 48.2 L 38.2 52.7 L 32 56.2
             L 25.8 52.7 L 26.1 48.2 L 20.9 45.2 L 17.2 47.7 L 11 44.1
             L 11 37 L 15 35 L 15 29 L 11 27 L 11 19.9
             L 17.2 16.3 L 20.9 18.8 L 26.1 15.8 L 25.8 11.3 L 32 7.8
             L 38.2 11.3 L 37.9 15.8 L 43.1 18.8 L 46.8 16.3 Z"
          fill="none" stroke="#00ccff" stroke-width="1.5"
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- 
      LAYER 2: INNER GLOW (PURPLE) & FADE FILL
      An inset layer that creates the faint purple inner neon glow and adds a very faint purple tint.
    -->
    <path d="M 51.5 21
             L 51.5 27.5 L 47.5 29.5 L 47.5 34.5 L 51.5 36.5 L 51.5 43
             L 46 46.5 L 42 44 L 37 47 L 37.5 51 L 32 54
             L 26.5 51 L 27 47 L 22 44 L 18 46.5 L 12.5 43
             L 12.5 36.5 L 16.5 34.5 L 16.5 29.5 L 12.5 27.5 L 12.5 21
             L 18 17.5 L 22 20 L 27 17 L 26.5 13 L 32 10
             L 37.5 13 L 37 17 L 42 20 L 46 17.5 Z"
          fill="#6c5ce7" fill-opacity="0.08" 
          stroke="#6c5ce7" stroke-width="2" filter="url(#purpleGlowBlur)" opacity="0.8"
          stroke-linejoin="round" />

    <!-- 
      LAYER 3: SETTINGS INTERNAL ELEMENTS
      Kept exactly intact.
    -->
    <!-- 虚线六边形辅助结构 -->
    <path d="M 32 20 L 42.4 26 L 42.4 38 L 32 44 L 21.6 38 L 21.6 26 Z" 
          fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.3" stroke-dasharray="2 2" />

    <!-- 顶部倒三角 -->
    <polygon points="30.5,12 33.5,12 32,15" fill="#6c5ce7" opacity="0.9" />

    <!-- 左侧内部走线与端点 -->
    <path d="M 19 42 L 23 42 L 25 40 L 27 40" fill="none" stroke="#6c5ce7" stroke-width="1.5" opacity="0.8" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="19" cy="42" r="1.5" fill="#00ccff" opacity="0.9" />

    <!-- 右侧内部走线与端点 -->
    <path d="M 45 42 L 41 42 L 39 40 L 37 40" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.7" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="45" cy="42" r="1.5" fill="#6c5ce7" opacity="0.9" />

    <!-- 顶部辅助悬浮节点 -->
    <line x1="41" y1="22" x2="44" y2="22" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="20" y1="22" x2="23" y2="22" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <!-- 中央核心枢纽 (亮蓝色) -->
    <circle cx="32" cy="32" r="5" fill="none" stroke="#00ccff" stroke-width="1.5" />
    <circle cx="32" cy="32" r="1.5" fill="#6c5ce7" opacity="0.9" />
    
    <!-- 核心十字准星 (亮蓝色) -->
    <line x1="32" y1="24" x2="32" y2="26.5" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="37.5" x2="32" y2="40" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="24" y1="32" x2="26.5" y2="32" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="37.5" y1="32" x2="40" y2="32" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" />
</svg>

